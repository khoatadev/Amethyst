font_family ComicShannsMono Nerd Font
bold_font ComicShannsMono Nerd Font
italic_font auto
bold_italic_font auto
font_size 11

# Nền đen, trong suốt nhẹ
background_opacity 0.85
background_blur 20
confirm_os_window_close 0

# "Prism" — chữ trắng sáng, accent bão hòa cao, dễ đọc trên đen
foreground #e8e6f0
background #000000
selection_foreground #0b0c10
selection_background #8fa8ff
cursor #8fa8ff
cursor_text_color #0b0c10

# Cursor block, blink 0.5s/lần, trail
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.3 0.8

# 16 màu Prism
color0  #0b0c10
color8  #4d5262
color1  #ff5c7a
color9  #ff8298
color2  #4ede9e
color10 #7cf0ba
color3  #ffcc4d
color11 #ffe08a
color4  #5c9dff
color12 #8cbcff
color5  #c07bff
color13 #d9a6ff
color6  #38d6d6
color14 #72eaea
color7  #d5d8e3
color15 #ffffff
