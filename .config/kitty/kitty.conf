# amethyst rice — kitty
# Palette duy nhất: themes/amethyst.conf (spec: ~/Projects/Amethyst/AMETHYST.md)

include themes/amethyst.conf

# === Font ===
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
modify_font      cell_height 110%   # line-height thoáng hơn một chút

# === Window ===
window_padding_width    10
background_opacity      0.90   # lộ wallpaper amethyst phía sau; blur do mango phụ trách
confirm_os_window_close 0
hide_window_decorations yes

# === Cursor ===
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_trail          3          # vệt mờ khi di chuyển con trỏ
cursor_trail_decay    0.1 0.4
mouse_hide_wait       2.0

# === Scrollback & clipboard ===
scrollback_lines 20000
copy_on_select   no

# === Bell ===
enable_audio_bell    no
visual_bell_duration 0.0   # chỉ nhấp viền (bell_border_color = pyrite)

# === Tab bar — powerline slanted, chỉ hiện khi có ≥ 2 tab ===
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_edge          bottom
tab_bar_min_tabs      2
tab_bar_align         left
tab_padding_size      12
tab_bar_margin_height 4.0 2.0
tab_title_template    " {index} {title[:24]} "
