font_family ComicShannsMono Nerd Font
bold_font ComicShannsMono Nerd Font
italic_font auto
bold_italic_font auto
font_size 11

# Nền đen, trong suốt nhẹ
background_opacity 0.85
background_blur 20
confirm_os_window_close 0

# Base màu kem ấm chủ đạo
foreground #f5e6c8
background #000000
selection_foreground #000000
selection_background #f5e6c8
cursor #f5e6c8
cursor_text_color #000000

# Cursor block, blink 0.5s/lần, trail
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.3 0.8

# 16 màu: kem + xám, hue rất nhạt để ANSI vẫn phân biệt
color0  #141210
color8  #3d3830
color1  #c98b6b
color9  #e0a98c
color2  #b8a97a
color10 #d6c79a
color3  #d8c08a
color11 #f0dcae
color4  #a8a49a
color12 #c9c5bb
color5  #b9a49a
color13 #d6c1b8
color6  #c2b49a
color14 #dbcfb8
color7  #e6d8bd
color15 #fff6e0
