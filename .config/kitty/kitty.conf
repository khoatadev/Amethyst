font_family ComicShannsMono Nerd Font
bold_font ComicShannsMono Nerd Font
italic_font auto
bold_italic_font auto
font_size 11

# Nền đen, trong suốt nhẹ
background_opacity 0.85
background_blur 20
confirm_os_window_close 0

# "Vivid" — chữ trắng tinh, accent sáng gắt, tương phản tối đa trên đen
foreground #f7f8ff
background #000000
selection_foreground #000000
selection_background #6ea8ff
cursor #6ea8ff
cursor_text_color #000000

# Cursor block, blink 0.5s/lần, trail
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.3 0.8

# 16 màu Vivid
color0  #08080c
color8  #5a6070
color1  #ff3b5c
color9  #ff738c
color2  #22f59a
color10 #71ffc0
color3  #ffc400
color11 #ffdc5c
color4  #3d8bff
color12 #7ab4ff
color5  #b44dff
color13 #d18cff
color6  #00e5e5
color14 #5cffff
color7  #e2e6f2
color15 #ffffff
