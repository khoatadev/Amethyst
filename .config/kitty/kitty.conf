font_family ComicShannsMono Nerd Font
bold_font ComicShannsMono Nerd Font
italic_font auto
bold_italic_font auto
font_size 11

# Nền đen, trong suốt nhẹ
background_opacity 0.85
background_blur 20
confirm_os_window_close 0

# Base màu neon: đen + magenta chủ đạo, cyan accent
foreground #ffe6f7
background #000000
selection_foreground #000000
selection_background #ff2ec4
cursor #ff2ec4
cursor_text_color #000000

# Cursor block, blink 0.5s/lần, trail đậm
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.3 0.8
cursor_trail_start_threshold 2

# 16 màu neon (magenta chủ đạo)
color0  #111111
color8  #444444
color1  #ff2ec4
color9  #ff6ad5
color2  #00ff9f
color10 #6effc6
color3  #ffe94a
color11 #fff58c
color4  #00c8ff
color12 #4fe3ff
color5  #b967ff
color13 #d3a5ff
color6  #00ffcc
color14 #7dffe6
color7  #c9d1d9
color15 #ffffff
