# graphite rice — kitty
# Palette duy nhất: themes/graphite.conf (spec giữ ở máy, không public)
# Lưu ý: kitty.conf không hỗ trợ inline comment — comment phải ở dòng riêng

include themes/graphite.conf

# === Font ===
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Line-height thoáng hơn một chút
modify_font      cell_height 110%

# === Window ===
# Opacity 0.90 để lộ wallpaper phía sau; blur do mango phụ trách
background_opacity      0.90
# Padding thoáng quanh nội dung window
window_padding_width    12
confirm_os_window_close 0
hide_window_decorations yes

# === Cursor ===
# Con trỏ block nhấp nháy
cursor_shape          block
cursor_blink_interval 0.5
# Vệt mờ khi di chuyển con trỏ
cursor_trail          3
cursor_trail_decay    0.1 0.4
mouse_hide_wait       2.0
# Tắt feature cursor của shell integration (bash integration phát \e[5 q beam mỗi prompt)
shell_integration     no-cursor

# === Scrollback & clipboard ===
scrollback_lines 20000
copy_on_select   no

# === Bell ===
# Chỉ nhấp viền, không âm thanh (bell_border_color = terminal-yellow trong theme)
enable_audio_bell    no
visual_bell_duration 0.3

# === Tab bar — powerline slanted, chỉ hiện khi có ≥ 2 tab ===
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_edge          bottom
tab_bar_min_tabs      2
tab_bar_align         left
tab_bar_margin_height 4.0 2.0
tab_title_template    " {index} {title[:24]} "
