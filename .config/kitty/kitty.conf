font_family ComicShannsMono Nerd Font
bold_font ComicShannsMono Nerd Font
italic_font auto
bold_italic_font auto
font_size 11

# Nền đen, trong suốt nhẹ
background_opacity 0.85
background_blur 20
confirm_os_window_close 0

# "Inkwell" — trắng ngà ấm trên đen, accent ngọc bão hòa thấp
foreground #ded8d0
background #000000
selection_foreground #0e0f12
selection_background #dcaf5a
cursor #dcaf5a
cursor_text_color #0e0f12

# Cursor block, blink 0.5s/lần, trail
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.3 0.8

# 16 màu Inkwell
color0  #0e0f12
color8  #4a4744
color1  #d9536b
color9  #e87a8d
color2  #6fa96b
color10 #8cc286
color3  #dcaf5a
color11 #eec680
color4  #5f8fc7
color12 #82aad9
color5  #b07ec6
color13 #c79ed9
color6  #4fb0a8
color14 #6fc9c0
color7  #cdc8c0
color15 #f2eee8
