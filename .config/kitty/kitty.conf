color9  #ff6ad5
color2  #00ff9f
color10 #6effc6
color3  #ffe94a
color11 #fff58c
color4  #00c8ff
color12 #4fe3ff
color5  #b967ff
color13 #d3a5ff
color6  #00ffcc
color14 #7dffe6
color7  #c9d1d9
color15 #ffffff
