font_family ComicShannsMono Nerd Font
bold_font ComicShannsMono Nerd Font
italic_font auto
bold_italic_font auto
font_size 11

# Nền đen, trong suốt nhẹ
background_opacity 0.85
background_blur 20
confirm_os_window_close 0

# Base màu Tokyo Night (giữ nền đen)
foreground #c0caf5
background #000000
selection_foreground #c0caf5
selection_background #283457
cursor #c0caf5
cursor_text_color #1a1b26

# Cursor block, blink 0.5s/lần, trail
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.3 0.8

# 16 màu Tokyo Night
color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5
