# vim:ft=kitty

## name: Amethyst
## author: khoa
## license: MIT
## upstream: ~/Projects/Amethyst/AMETHYST.md
## blurb: Nền plum tối #16111F, accent amethyst #9966CC — theme đá amethyst cho dotfiles

# Nền & chữ (bg-deep / crystal / amethyst / gentoo)
background            #16111F
foreground            #EDE6F6
cursor                #9966CC
cursor_text_color     #16111F
selection_background  #54487A
selection_foreground  #EDE6F6
url_color             #7B8FD4

# Viền window (amethyst khi focus, bg-active khi vắng, pyrite khi bell)
active_border_color   #9966CC
inactive_border_color #2C2340
bell_border_color     #D8A657

# Tab bar (nền bg-deep, tab active nổi bg-raised, chữ inactive lavender)
tab_bar_background      #16111F
tab_bar_margin_color    #16111F
active_tab_background   #211A2E
active_tab_foreground   #EDE6F6
inactive_tab_background #16111F
inactive_tab_foreground #C5A3E0

# 16 màu terminal — hue chuẩn, đều pha ánh tím
color0  #2C2340
