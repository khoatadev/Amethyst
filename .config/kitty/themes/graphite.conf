# vim:ft=kitty

## name: Graphite
## author: khoa
## license: MIT
## blurb: Nền than #101113, một accent duy nhất #93B1C6 — theme tối giản cho dotfiles

# Nền & chữ (bg / text / accent / bg-active)
background            #101113
foreground            #E8EAED
cursor                #93B1C6
cursor_text_color     #101113
selection_background  #2E3134
selection_foreground  #E8EAED
url_color             #93B1C6

# Viền window (accent khi focus, line khi vắng, terminal-yellow khi bell)
active_border_color   #93B1C6
inactive_border_color #2E3134
bell_border_color     #C4B689

# Tab bar (nền bg, tab active nổi bg-raised, chữ inactive text-muted)
tab_bar_background      #101113
tab_bar_margin_color    #101113
active_tab_background   #181A1D
active_tab_foreground   #E8EAED
inactive_tab_background #101113
inactive_tab_foreground #9AA0A6

# 16 màu terminal — hue chuẩn, đều bão hòa thấp nằm trong tổng thể xám
color0  #232629
color1  #C98A8A
color2  #96B58F
color3  #C4B689
color4  #8FA3C0
color5  #B394BE
color6  #8FB8B5
color7  #C9CCD1

color8  #3A3E43
color9  #DBA2A2
color10 #B3CBAE
color11 #D6CBAA
color12 #A7B8CF
color13 #C5ADD0
color14 #A9CCC9
color15 #E8EAED
