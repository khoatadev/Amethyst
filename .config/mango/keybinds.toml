# =====================================================================
# Module: Phím tắt bàn phím (Keybinds)
# Tên phím xem bằng lệnh `xev` hoặc `wev`
# Modifier: super, ctrl, alt, shift, none
# =====================================================================

[bind.default]

# Reload config
"SUPER+r" = "reload_config"

# Menu và terminal
"SUPER+d" = "spawn,quickshell ipc call launcher toggle"
"SUPER+t" = "spawn,kitty"

# File manager
"SUPER+e" = "spawn,kitty yazi"

# Trình duyệt
"SUPER+z" = "spawn,zen"

# Chụp màn hình (grim + slurp)
"SUPER+p" = "spawn,~/.config/mango/scripts/screenshot.sh region"
"SUPER+SHIFT+p" = "spawn,~/.config/mango/scripts/screenshot.sh full"

# Thoát mango / đóng cửa sổ
"SUPER+SHIFT+Escape" = "quit"
"SUPER+q" = "killclient,"

# Âm lượng
"ALT+F1" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"ALT+F2" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"ALT+F3" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"

# Độ sáng
"ALT+F4" = "spawn,brightnessctl set 5%-"
"ALT+F5" = "spawn,brightnessctl set 5%+"

# Điều khiển nhạc (playerctl)
"SUPER+space" = "spawn,playerctl play-pause"
"SUPER+F1" = "spawn,playerctl previous"
"SUPER+F2" = "spawn,playerctl next"

# Chuyển focus cửa sổ
"SUPER+Tab" = "focusstack,next"
"ALT+Left" = "focusdir,left"
"ALT+Right" = "focusdir,right"
"ALT+Up" = "focusdir,up"
"ALT+Down" = "focusdir,down"

# Di chuyển cửa sổ
"SUPER+SHIFT+Up" = "move_client,up"
"SUPER+SHIFT+Down" = "move_client,down"
"SUPER+SHIFT+Left" = "move_client,left"
"SUPER+SHIFT+Right" = "move_client,right"

# Trạng thái cửa sổ
"SUPER+g" = "toggleglobal,"
"ALT+Tab" = "togglejump,"
"ALT+backslash" = "togglefloating,"
"ALT+a" = "togglemaximizescreen,"
"ALT+f" = "togglefullscreen,"
"ALT+SHIFT+f" = "togglefakefullscreen,"
"SUPER+i" = "minimized,"
"SUPER+o" = "toggleoverlay,"
"SUPER+SHIFT+I" = "restore_minimized"
"ALT+z" = "toggle_scratchpad"

# Scroller layout
"ALT+e" = "set_proportion,1.0"
"ALT+x" = "switch_proportion_preset,"
"alt+super+ctrl+Left" = "scroller_stack,left"
"alt+super+ctrl+Right" = "scroller_stack,right"
"alt+super+ctrl+Up" = "scroller_stack,up"
"alt+super+ctrl+Down" = "scroller_stack,down"

# Dwindle layout (chế độ chia tay thủ công)
"alt+shift+Return" = "dwindle_toggle_split_direction"

# Đổi layout
"SUPER+n" = "switch_layout"

# Xem tag (workspace)
"SUPER+Left" = "viewtoleft,0"
"CTRL+Left" = "viewtoleft_have_client,0"
"SUPER+Right" = "viewtoright,0"
"CTRL+Right" = "viewtoright_have_client,0"
"CTRL+SUPER+Left" = "tagtoleft,0"
"CTRL+SUPER+Right" = "tagtoright,0"
"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"

# Gửi cửa sổ sang tag và focus theo
# (tagsilent: gửi cửa sổ sang tag nhưng không focus)
# bind=Alt,1,tagsilent,1
"Alt+1" = "tag,1,0"
"Alt+2" = "tag,2,0"
"Alt+3" = "tag,3,0"
"Alt+4" = "tag,4,0"
"Alt+5" = "tag,5,0"
"Alt+6" = "tag,6,0"
"Alt+7" = "tag,7,0"
"Alt+8" = "tag,8,0"
"Alt+9" = "tag,9,0"

# Chuyển giữa các màn hình
"alt+shift+Left" = "focusmon,left"
"alt+shift+Right" = "focusmon,right"
"SUPER+Alt+Left" = "tagmon,left"
"SUPER+Alt+Right" = "tagmon,right"

# Tăng/giảm/tắt gaps
"ALT+SHIFT+X" = "incgaps,1"
"ALT+SHIFT+Z" = "incgaps,-1"
"ALT+SHIFT+R" = "togglegaps"

# Di chuyển cửa sổ (floating)
"CTRL+SHIFT+Up" = "movewin,+0,-50"
"CTRL+SHIFT+Down" = "movewin,+0,+50"
"CTRL+SHIFT+Left" = "movewin,-50,+0"
"CTRL+SHIFT+Right" = "movewin,+50,+0"

# Thay đổi kích thước cửa sổ
"CTRL+ALT+Up" = "resizewin,+0,-50"
"CTRL+ALT+Down" = "resizewin,+0,+50"
"CTRL+ALT+Left" = "resizewin,-50,+0"
"CTRL+ALT+Right" = "resizewin,+50,+0"
