# =====================================================================
# Module: Thiết bị nhập (bàn phím, touchpad, chuột, con trỏ)
# Lưu ý: thay đổi touchpad/chuột cần đăng nhập lại mới áp dụng
# =====================================================================

[global]

# --- Bàn phím ---
repeat_rate = 25
repeat_delay = 600
numlock_on = 0
xkb_rules_layout = "us"
xkb_rules_options = "caps:escape"

# --- Touchpad ---
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 0
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

# --- Chuột & con trỏ ---
mouse_natural_scrolling = 0
cursor_size = 24
