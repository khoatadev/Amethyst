# --- Layer rules: hiệu ứng layer-shell (ví dụ: rofi) ---

[[rule.layer_rule]]
animation_type_open = "zoom"
layer_name = "rofi"

[[rule.layer_rule]]
animation_type_close = "zoom"
layer_name = "rofi"

# Quickshell launcher tự xử lý animation trong QML -> tắt animation/blur/shadow của compositor
[[rule.layer_rule]]
no_animation = 1
no_blur = 1
no_shadow = 1
layer_name = "launcher"
