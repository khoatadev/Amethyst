# =====================================================================
# Module: Quy tắc (Rules)
# - tag_rule:   layout mặc định cho từng tag
# - layer_rule: hiệu ứng cho các layer-shell (rofi, thanh bar...)
# Layout hỗ trợ: tile, scroller, grid, deck, monocle,
#                center_tile, vertical_tile, vertical_scroller
# =====================================================================

# --- Tag rules: layout mặc định của từng tag ---

[[rule.tag_rule]]
id = 1
layout_name = "tile"

