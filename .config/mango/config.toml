# =====================================================================
# Config chính của mango — chỉ nạp các module nhỏ cùng thư mục
# Xem thêm: https://github.com/DreamMaoMao/mango/wiki/
#
# Cấu trúc module (bản gốc còn lưu tại ./config.toml.bak):
#   window-effects.toml  - hiệu ứng cửa sổ (blur, shadow, opacity, dim)
#   animations.toml      - hiệu ứng chuyển động (animation)
#   layouts.toml         - cài đặt layout (scroller/master/dwindle/monocle/deck)
#   overview.toml        - overview & hotarea
#   behavior.toml        - hành vi WM (focus, snap, kéo-thả, idle...)
#   appearance.toml      - gaps, viền, bảng màu
#   input.toml           - bàn phím, touchpad, chuột, con trỏ
#   keybinds.toml        - phím tắt bàn phím
#   mousebinds.toml      - phím tắt chuột & con lăn
#   gestures.toml        - cử chỉ touchpad
#   rules.toml           - quy tắc tag / layer
# =====================================================================

[global]

source = [
    "./autostart.toml",
    "./window-effects.toml",
    "./animations.toml",
    "./layouts.toml",
    "./overview.toml",
    "./behavior.toml",
    "./appearance.toml",
    "./input.toml",
    "./keybinds.toml",
    "./mousebinds.toml",
    "./gestures.toml",
    "./rules.toml",
]
